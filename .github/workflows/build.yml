name: Build Boards

on:
  workflow_dispatch: # 支持网页手动点击运行
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 使用稳定的 v4 版本

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          # 直接写死只编译 otto-robot，并将 name 参数改为 otto-robot
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # 编译成功后，压缩包的名字
          name: xiaozhi_otto-robot_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
